[package]
name = "larust-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
larust-auth = { workspace = true }
larust-core = { workspace = true }
# Explicit `path`, not `workspace = true` - see `larust-cache/Cargo.toml`'s
# own comment for why `default-features` can't be overridden otherwise.
larust-http = { path = "../larust-http", default-features = false }
larust-orm = { path = "../larust-orm", default-features = false }
axum = { workspace = true }
form_urlencoded = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Not `workspace = true` for the same reason `larust-orm/Cargo.toml`
# isn't - see that crate's own comment.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "derive"] }
sqlx-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# See `larust-orm/Cargo.toml`'s own comment on this table's shape/reasoning.
[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "larust-http/sqlite", "larust-orm/sqlite"]
mysql = ["sqlx/mysql", "larust-http/mysql", "larust-orm/mysql"]
postgres = ["sqlx/postgres", "larust-http/postgres", "larust-orm/postgres"]

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
