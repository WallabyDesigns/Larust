[package]
name = "larust-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
futures-core = { workspace = true }
tower-http = { workspace = true }
tokio-stream = { workspace = true }
# `tower::service_fn` - `serve()`'s own `ServeDir::not_found_service(...)`
# call (routes a genuinely dead URL through `AppError::NotFound` instead of
# `ServeDir`'s own bare 404). Was a dev-only dependency before that -
# promoted here rather than duplicated across both tables.
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
# A raw `fcntl` call clearing `FD_CLOEXEC` on the listening socket before
# a restart handoff (`lifecycle::listener`) -- std sets it on every socket
# by default, specifically to *prevent* fd inheritance across `exec`. Also
# used by `lifecycle::supervisor`'s Linux backend for a raw `prctl` call
# (`PR_SET_PDEATHSIG`/`getppid` aren't exposed by this pinned `libc`
# version for real Linux targets -- declared locally there instead).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `WSADuplicateSocketW`/`WSASocketW` (`lifecycle::listener`, the restart
# handoff's socket-passing mechanism) and `GenerateConsoleCtrlEvent`
# (`tests/graceful_shutdown.rs`, `tests/listener_handoff.rs` -- delivering
# a real termination signal to a spawned child process) all live here so
# there's one `windows-sys` entry instead of a separate, redundant
# dev-dependency duplicating half its feature list. `Win32_System_JobObjects`
# is `lifecycle::supervisor`'s Windows backend -- assigns every spawned
# replacement to a job object with `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE`, so
# the OS kills it if `xr dev` itself dies for any reason.
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    # `CreateJobObjectW`'s `lpjobattributes` parameter is a
    # `*const SECURITY_ATTRIBUTES` -- windows-sys gates that function
    # behind this feature even though the value passed is always null here.
    "Win32_Security",
] }

[dev-dependencies]
tempfile = { workspace = true }
