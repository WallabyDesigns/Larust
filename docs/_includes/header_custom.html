<!--
  Rendered inside just-the-docs' own #main-header bar, next to search and
  before the GitHub aux link (see components/header.html) - the docs
  site's counterpart to the demo app's own `.theme-toggle` button
  (`demo/resources/views/layouts/app.blade.xr`), same icons, same idea:
  jtd.setTheme(...) swaps the compiled stylesheet
  (assets/css/just-the-docs-<scheme>.css) rather than flipping a
  `data-theme` attribute the way the demo app's own CSS-variable-based
  theming does - a real, structural difference from the demo worth
  knowing if this ever needs touching again.
-->
<button class="lr-theme-toggle" type="button" aria-label="Toggle color theme">
  <svg class="lr-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
  </svg>
  <svg class="lr-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
  </svg>
</button>

<script>
  (function () {
    function ariaLabelFor(scheme) {
      return scheme === "larust-dark" ? "Use light theme" : "Use dark theme";
    }

    function sync(scheme) {
      document.documentElement.dataset.lrTheme = scheme === "larust-dark" ? "dark" : "light";
      var btn = document.querySelector(".lr-theme-toggle");
      if (btn) btn.setAttribute("aria-label", ariaLabelFor(scheme));
    }

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".lr-theme-toggle")) return;
      var current = jtd.getTheme();
      var next = current === "larust-dark" ? "larust" : "larust-dark";
      jtd.setTheme(next);
      try {
        localStorage.setItem("larust-color-scheme", next);
      } catch (e) {
        // Ignore - the toggle still works for this page view either way.
      }
      sync(next);
    });

    sync(jtd.getTheme());
  })();
</script>
