[workspace]
resolver = "2"
members = ["crates/*", "examples/*", "demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
larust-auth = { path = "crates/larust-auth" }
larust-cache = { path = "crates/larust-cache" }
larust-convert = { path = "crates/larust-convert" }
larust-core = { path = "crates/larust-core" }
larust-db = { path = "crates/larust-db" }
larust-events = { path = "crates/larust-events" }
larust-http = { path = "crates/larust-http" }
larust-live = { path = "crates/larust-live" }
larust-macros = { path = "crates/larust-macros" }
larust-mail = { path = "crates/larust-mail" }
larust-mssql = { path = "crates/larust-mssql" }
larust-notifications = { path = "crates/larust-notifications" }
larust-orm = { path = "crates/larust-orm" }
larust-permissions = { path = "crates/larust-permissions" }
larust-queue = { path = "crates/larust-queue" }
larust-repository = { path = "crates/larust-repository" }
larust-reverb = { path = "crates/larust-reverb" }
larust-sanctum = { path = "crates/larust-sanctum" }
larust-scheduler = { path = "crates/larust-scheduler" }
larust-sitemap = { path = "crates/larust-sitemap" }
larust-socialite = { path = "crates/larust-socialite" }
larust-spa = { path = "crates/larust-spa" }
larust-storage = { path = "crates/larust-storage" }
larust-support = { path = "crates/larust-support" }
larust-testing = { path = "crates/larust-testing" }
larust-validation = { path = "crates/larust-validation" }
larust-view = { path = "crates/larust-view" }

axum = { version = "0.7", features = ["multipart", "ws"] }
# `cookie` only - the plain, unsigned `CookieJar` (see
# `larust-http::preferences`'s own doc comment for why unsigned is a
# deliberate choice, not an oversight). Neither `PrivateCookieJar` nor
# `SignedCookieJar` needs enabling since this workspace never uses them.
axum-extra = { version = "0.9", default-features = false, features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
pathdiff = "0.2"
tempfile = "3"
syn = "2"
quote = "1"
proc-macro2 = "1"
form_urlencoded = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "postgres", "any", "derive"] }
# `larust-db`'s SQL admin dashboard needs `AnyColumn`/`AnyValueKind` to
# generically decode/bind a row it knows nothing about at compile time -
# the `sqlx` facade crate doesn't re-export either, only `sqlx-core` does.
# Same already-locked version as `sqlx` itself (confirmed via Cargo.lock),
# so this resolves to the identical instance already in the dependency
# graph, not a second copy.
sqlx-core = { version = "0.8", default-features = false, features = ["any"] }
tower-sessions = "0.13"
# `tower_sessions::SessionStore` is implemented directly against
# `sqlx::AnyPool` in `larust_http::session` (see that module's own doc
# comment) rather than depending on a third-party per-backend store crate -
# needed since `AnyPool` doesn't hand out a concretely-typed `SqlitePool`/
# `MySqlPool` a store crate like `tower-sessions-sqlx-store` would require.
async-trait = "0.1"
# Matches `tower_sessions::session::Record.expiry_date`'s own type - used
# only in `larust-http`'s session store tests to build a `Record` by hand.
time = "0.3"
rand = "0.8"
argon2 = "0.5"
notify = "8"
notify-debouncer-mini = "0.7"
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
futures-core = "0.3"
tower-http = { version = "0.7", features = ["catch-panic", "fs", "set-header"] }
ammonia = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
cron = "0.17"
chrono = "0.4"
sha2 = "0.10"
tokio-stream = { version = "0.1", features = ["sync"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
# SQL Server has no `sqlx` driver at all - `tiberius` is the pure-Rust TDS
# client `larust-mssql` connects through instead, entirely outside the
# `sqlx::Any`/`Backend` architecture (see that crate's own doc comment).
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono"] }
# The `AsyncRead`/`AsyncWrite` <-> `futures` compatibility shim `tiberius`
# needs to run its TDS protocol over a plain `tokio::net::TcpStream`.
tokio-util = { version = "0.7", features = ["compat"] }
# `xr new`'s interactive wizard (`larust-cli/src/wizard.rs`) - arrow-key
# text/confirm/multi-select prompts. Only `larust-cli` depends on this;
# nothing generated-app-facing ever does.
dialoguer = "0.11"
# `larust-db`'s embedded key-value store - pure-Rust (no C toolchain at
# build time, unlike `sqlx-sqlite`'s bundled C amalgamation), single-file,
# MVCC. See that crate's own doc comment for why it exists alongside
# `larust_orm` rather than replacing it.
redb = "2"
