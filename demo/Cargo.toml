[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
larust-core = { path = "../crates/larust-core" }
larust-http = { path = "../crates/larust-http" }
larust-support = { path = "../crates/larust-support", features = ["db", "permissions", "reverb", "sanctum", "sitemap"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"

[dev-dependencies]
larust-testing = { path = "../crates/larust-testing" }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
